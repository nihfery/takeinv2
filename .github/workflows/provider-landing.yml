name: Provider Landing

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/provider-landing/**"
      - "packages/**"
      - ".github/workflows/provider-landing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/provider-landing
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/provider-landing/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run lint when configured
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No lint script is configured."
          fi

      - name: Run tests when configured
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No test script is configured."
          fi

      - name: Build provider landing
        env:
          NEXT_PUBLIC_BACKEND_URL: https://api.example.invalid
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api
          NEXT_PUBLIC_PROVIDER_LOGIN_PATH: /provider/signin
          NEXT_PUBLIC_PROVIDER_LOGIN_URL: https://provider.example.invalid/provider/login
          NEXT_PUBLIC_PROVIDER_DASHBOARD_URL: https://provider.example.invalid/provider/dashboard
          NEXT_PUBLIC_PROVIDER_VERIFICATION_URL: https://provider.example.invalid/provider/verification
        run: npm run build
