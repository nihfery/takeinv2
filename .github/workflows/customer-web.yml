name: Customer Web

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/customer-web/**"
      - "packages/**"
      - ".github/workflows/customer-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/customer-web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/customer-web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run lint when configured
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No lint script is configured."
          fi

      - name: Run tests when configured
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No test script is configured."
          fi

      - name: Build customer application
        env:
          GO_API_BASE_URL: http://127.0.0.1:8088
          NEXT_PUBLIC_BACKEND_URL: https://api.example.invalid
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid/api
          NEXT_PUBLIC_PROVIDER_FRONTEND_URL: https://partners.example.invalid
          NEXT_PUBLIC_CUSTOMER_APP_URL: https://customer.example.invalid
        run: npm run build
