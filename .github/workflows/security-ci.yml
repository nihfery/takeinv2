name: Go security CI

on:
  pull_request:
    paths: ["backend/services/**", "backend/libs/go/**", "backend/tools/**", "backend/tests/e2e/**", "backend/**/go.mod", "backend/**/go.sum", "backend/**/Dockerfile", ".github/workflows/security-ci.yml"]
  push:
    branches: [main]
  schedule:
    - cron: "31 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-vulnerability-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: 1.26.6, cache-dependency-path: "**/go.sum"}
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan every Go module
        run: |
          set -eu
          for module in gen/go libs/go services/* tools/contract-check tools/kafka-admin tools/schema-migrator tools/testdb; do
            (cd "$module" && govulncheck ./...)
          done
          (cd tests/e2e && GOWORK=off govulncheck ./...)

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
