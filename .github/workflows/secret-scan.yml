name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install pinned Gitleaks CLI
        env:
          GOBIN: ${{ runner.temp }}/gitleaks-bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Scan complete Git history
        id: scan
        continue-on-error: true
        run: >-
          gitleaks git
          --log-opts="${{ github.sha }}"
          --redact
          --verbose
          --no-banner
          --report-format sarif
          --report-path gitleaks.sarif
          .

      - name: Upload redacted secret scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-${{ github.run_id }}
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 30

      - name: Enforce secret scan result
        if: steps.scan.outcome == 'failure'
        run: |
          echo "Gitleaks found a secret or failed to complete; inspect the redacted report." >&2
          exit 1
