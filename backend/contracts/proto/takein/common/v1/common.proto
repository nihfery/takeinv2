syntax = "proto3";

package takein.common.v1;

option go_package = "github.com/nihfery/takein/gen/go/takein/common/v1;commonv1";

import "google/protobuf/timestamp.proto";

message RequestMetadata {
  string request_id = 1;
  string correlation_id = 2;
  string actor_id = 3;
  string actor_role = 4;
  string provider_id = 5;
  string branch_id = 6;
  repeated string permissions = 7;
}

message Money {
  int64 minor_units = 1;
  string currency = 2;
}

message PageRequest {
  int32 page = 1;
  int32 per_page = 2;
}

message PageInfo {
  int32 page = 1;
  int32 per_page = 2;
  int64 total = 3;
}

message TimeRange {
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Timestamp ends_at = 2;
}
