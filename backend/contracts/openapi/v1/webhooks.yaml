{
  "openapi": "3.1.0",
  "info": {
    "title": "TAKEIN Webhook API",
    "version": "1.0.0",
    "description": "Existing external webhook ingress. Midtrans notifications are accepted only after SHA-512 body-signature validation and an authoritative server-to-server status lookup; duplicate delivery is handled by the payment state-transition logic."
  },
  "servers": [
    {
      "url": "https://hooks.takein.id/api",
      "description": "Production webhook ingress"
    }
  ],
  "paths": {
    "/midtrans/notification": {
      "post": {
        "operationId": "receiveMidtransNotification",
        "summary": "Receive a Midtrans payment or subscription notification",
        "x-authentication": "midtrans-body-signature+server-verification",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MidtransNotification"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Notification verified and applied or replayed idempotently",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WebhookAcknowledgement"
                }
              }
            }
          },
          "403": {
            "description": "Invalid Midtrans signature",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/JsonObject"
                }
              }
            }
          },
          "404": {
            "description": "Payment or subscription was not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/JsonObject"
                }
              }
            }
          },
          "422": {
            "description": "Notification identity, order, amount, or currency did not match verified gateway state",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/JsonObject"
                }
              }
            }
          },
          "429": {
            "description": "Rate limited",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/JsonObject"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "JsonObject": {
        "type": "object",
        "additionalProperties": true
      },
      "WebhookAcknowledgement": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "message"
        ],
        "properties": {
          "message": {
            "type": "string",
            "enum": [
              "OK"
            ]
          }
        }
      },
      "MidtransNotification": {
        "type": "object",
        "required": [
          "signature_key",
          "order_id",
          "status_code",
          "gross_amount"
        ],
        "additionalProperties": true,
        "properties": {
          "signature_key": {
            "type": "string",
            "minLength": 1,
            "description": "SHA-512 signature over order_id + status_code + gross_amount + the configured Midtrans server key."
          },
          "order_id": {
            "type": "string",
            "minLength": 1
          },
          "status_code": {
            "type": "string",
            "minLength": 1
          },
          "gross_amount": {
            "oneOf": [
              {
                "type": "string"
              },
              {
                "type": "number"
              }
            ]
          },
        "transaction_status": {
          "type": "string",
          "description": "Gateway transaction status. Current mappings explicitly handle settlement, capture, pending, refund, expire, cancel, deny, and failure; unknown values remain pending."
        },
          "fraud_status": {
            "type": [
              "string",
              "null"
            ]
          },
          "currency": {
            "type": [
              "string",
              "null"
            ]
          },
          "transaction_id": {
            "type": [
              "string",
              "null"
            ]
          },
          "transaction_time": {
            "type": [
              "string",
              "null"
            ]
          },
          "expiry_time": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      }
    }
  }
}
