# Optional local developer overlay. Production/staging must not include this
# file: their APIs, gRPC listeners, and worker metrics remain private.
services:
  takein-identity-api:
    ports:
      - "127.0.0.1:${TAKEIN_IDENTITY_HTTP_PORT:-18081}:8080"
      - "127.0.0.1:${TAKEIN_IDENTITY_GRPC_PORT:-19081}:9090"
  takein-identity-worker:
    ports:
      - "127.0.0.1:${TAKEIN_IDENTITY_METRICS_PORT:-20081}:8081"

