name: salonku

include:
  - path: backend/docker-compose.yml

services:
  provider:
    build:
      context: .
      dockerfile: platform/docker/Dockerfile.next
      args:
        APP_PATH: apps/provider-landing
        GO_API_BASE_URL: http://takein-edge:8080
        GO_IDENTITY_URL: http://takein-identity-api:8080
        NEXT_PUBLIC_BACKEND_URL: "${TAKEIN_PUBLIC_API_URL:-http://127.0.0.1:8088}"
        NEXT_PUBLIC_API_BASE_URL: "${TAKEIN_PUBLIC_API_URL:-http://127.0.0.1:8088}/api"
        NEXT_PUBLIC_PROVIDER_FRONTEND_URL: "${PROVIDER_FRONTEND_URL:-http://127.0.0.1:5173}"
        NEXT_PUBLIC_PROVIDER_LOGIN_PATH: /register?mode=login
        NEXT_PUBLIC_PROVIDER_LOGIN_URL: "${PROVIDER_CONSOLE_URL:-http://127.0.0.1:5175}/provider/login"
        NEXT_PUBLIC_PROVIDER_DASHBOARD_URL: "${PROVIDER_CONSOLE_URL:-http://127.0.0.1:5175}/provider/dashboard"
        NEXT_PUBLIC_PROVIDER_VERIFICATION_URL: "${PROVIDER_CONSOLE_URL:-http://127.0.0.1:5175}/provider/verification"
    restart: unless-stopped
    init: true
    expose: ["3000"]
    environment:
      PORT: 3000
      GO_API_BASE_URL: http://takein-edge:8080
      GO_IDENTITY_URL: http://takein-identity-api:8080
      TAKEIN_COOKIE_SECURE: ${TAKEIN_COOKIE_SECURE:-false}
    networks: [takein_backend]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  customer:
    build:
      context: .
      dockerfile: platform/docker/Dockerfile.next
      args:
        APP_PATH: apps/customer-web
        GO_API_BASE_URL: http://takein-edge:8080
        GO_IDENTITY_URL: http://takein-identity-api:8080
        NEXT_PUBLIC_BACKEND_URL: "${TAKEIN_PUBLIC_API_URL:-http://127.0.0.1:8088}"
        NEXT_PUBLIC_API_BASE_URL: "${TAKEIN_PUBLIC_API_URL:-http://127.0.0.1:8088}/api"
        NEXT_PUBLIC_PROVIDER_FRONTEND_URL: "${PROVIDER_FRONTEND_URL:-http://127.0.0.1:5173}"
        NEXT_PUBLIC_CUSTOMER_APP_URL: "${CUSTOMER_FRONTEND_URL:-http://127.0.0.1:5174}"
        NEXT_PUBLIC_ALLOW_MANUAL_PAYMENT_CONFIRMATION: "false"
    restart: unless-stopped
    init: true
    expose: ["5174"]
    environment:
      PORT: 5174
      GO_API_BASE_URL: http://takein-edge:8080
      GO_IDENTITY_URL: http://takein-identity-api:8080
      TAKEIN_COOKIE_SECURE: ${TAKEIN_COOKIE_SECURE:-false}
    networks: [takein_backend]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5174/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  provider-console:
    build:
      context: .
      dockerfile: platform/docker/Dockerfile.next
      args:
        APP_PATH: apps/provider-console
        GO_API_BASE_URL: http://takein-edge:8080
        GO_IDENTITY_URL: http://takein-identity-api:8080
        NEXT_PUBLIC_PROVIDER_CONSOLE_URL: "${PROVIDER_CONSOLE_URL:-http://127.0.0.1:5175}"
        NEXT_PUBLIC_PROVIDER_LOGIN_URL: /provider/login
        NEXT_PUBLIC_PROVIDER_LANDING_URL: "${PROVIDER_FRONTEND_URL:-http://127.0.0.1:5173}"
    restart: unless-stopped
    init: true
    expose: ["5175"]
    environment:
      PORT: 5175
      GO_API_BASE_URL: http://takein-edge:8080
      GO_IDENTITY_URL: http://takein-identity-api:8080
      TAKEIN_COOKIE_SECURE: ${TAKEIN_COOKIE_SECURE:-false}
    networks: [takein_backend]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5175/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  admin-web:
    build:
      context: .
      dockerfile: platform/docker/Dockerfile.next
      args:
        APP_PATH: apps/admin-web
        GO_API_BASE_URL: http://takein-edge:8080
        GO_IDENTITY_URL: http://takein-identity-api:8080
        NEXT_PUBLIC_ADMIN_WEB_URL: "${ADMIN_FRONTEND_URL:-http://127.0.0.1:5176}"
    restart: unless-stopped
    init: true
    expose: ["5176"]
    environment:
      PORT: 5176
      GO_API_BASE_URL: http://takein-edge:8080
      GO_IDENTITY_URL: http://takein-identity-api:8080
      TAKEIN_COOKIE_SECURE: ${TAKEIN_COOKIE_SECURE:-false}
    networks: [takein_backend]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5176/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
